<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TELAS — Sala</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="room-page">

  <!-- ── Sidebar esquerda ──────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <!-- Logo -->
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="14" fill="#5865F2"/>
        <path d="M12 16h24M12 24h16M12 32h20" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <circle cx="36" cy="32" r="6" fill="#57F287"/>
      </svg>
      <span>TELAS</span>
    </div>

    <!-- Info da sala -->
    <div class="room-info">
      <div class="room-label">SALA</div>
      <div class="room-id-display" id="roomIdDisplay">—</div>
      <button class="btn-copy" id="btnCopyLink" title="Copiar link da sala">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2"/>
        </svg>
        Copiar link
      </button>
    </div>

    <!-- Participantes -->
    <div class="participants-section">
      <div class="section-label">PARTICIPANTES — <span id="userCount">0</span></div>
      <div class="participants-list" id="participantsList"></div>
    </div>

    <!-- Controles de mídia (rodapé da sidebar) -->
    <div class="sidebar-footer">
      <div class="user-tag">
        <div class="avatar-sm" id="myAvatarSidebar">?</div>
        <span id="myNameSidebar">—</span>
        <div class="status-dot online"></div>
      </div>
      <div class="media-controls">
        <button class="ctrl-btn" id="btnToggleMic" title="Microfone">
          <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 1a4 4 0 014 4v7a4 4 0 01-8 0V5a4 4 0 014-4z" stroke="currentColor" stroke-width="2"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btnToggleCam" title="Câmera">
          <svg id="camIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M23 7l-7 5 7 5V7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        <button class="ctrl-btn danger" id="btnLeave" title="Sair da sala">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Área principal ────────────────────────────────────────────────────── -->
  <main class="main-area">

    <!-- Header da área principal -->
    <header class="main-header">
      <div class="header-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="3" width="20" height="14" rx="2" stroke="#8b949e" stroke-width="2"/>
          <path d="M8 21h8M12 17v4" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="headerRoomName">Sala #——</span>
      </div>
      <div class="header-right">
        <button class="btn btn-screen" id="btnShareScreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 10l3-3 3 3M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="shareScreenLabel">Compartilhar Tela</span>
        </button>
        <button class="btn btn-outline btn-sm" id="btnToggleChat" title="Abrir/fechar chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          Chat
          <span class="chat-badge hidden" id="chatBadge">0</span>
        </button>
      </div>
    </header>

    <!-- Grade de vídeos -->
    <div class="video-grid" id="videoGrid">

      <!-- Tela compartilhada (fica maior quando ativa) -->
      <div class="video-tile screen-tile hidden" id="screenTile">
        <video id="screenVideo" autoplay playsinline></video>
        <div class="tile-label" id="screenLabel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Tela de —
        </div>
      </div>

      <!-- Minha câmera -->
      <div class="video-tile" id="myVideoTile">
        <video id="myVideo" autoplay muted playsinline></video>
        <div class="tile-label" id="myVideoLabel">Você</div>
        <div class="tile-muted hidden" id="myMutedIcon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <line x1="1" y1="1" x2="23" y2="23" stroke="#f04747" stroke-width="2"/>
            <path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V5a3 3 0 00-5.94-.6" stroke="#f04747" stroke-width="2"/>
            <path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v3M8 23h8" stroke="#f04747" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Tiles remotos gerados dinamicamente -->
    </div>

    <!-- Estado vazio (quando não há outros usuários) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔗</div>
      <h3>Sala pronta!</h3>
      <p>Compartilhe o link abaixo com seus amigos</p>
      <div class="share-link-box">
        <input type="text" id="shareLinkInput" readonly />
        <button class="btn btn-primary btn-sm" id="btnCopyLinkMain">Copiar</button>
      </div>
    </div>

  </main>

  <!-- ── Painel de Chat ────────────────────────────────────────────────────── -->
  <aside class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2"/>
      </svg>
      Chat
      <button class="chat-close" id="btnCloseChat">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-welcome">
        <p>💬 Bem-vindo ao chat da sala!</p>
      </div>
    </div>
    <div class="chat-input-area">
      <input
        type="text"
        id="chatInput"
        placeholder="Mensagem..."
        maxlength="500"
        autocomplete="off"
      />
      <button class="btn-send" id="btnSendChat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
