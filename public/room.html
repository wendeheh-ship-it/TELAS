<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TELAS — Sala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/room.css" />
</head>
<body>

<div class="app">

  <!-- ════════════════════════════════════════════
       SIDEBAR
  ════════════════════════════════════════════ -->
  <aside class="sidebar">

    <!-- Topo: nome do servidor -->
    <div class="sidebar-top">
      <div class="server-logo">T</div>
      <span class="server-name">TELAS</span>
    </div>

    <!-- Canais -->
    <div class="sidebar-section-label">CANAIS DE VOZ</div>
    <div class="channel-list">
      <div class="channel-item active" id="channelItem">
        <svg class="channel-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19.07 4.93a10 10 0 010 14.14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="channel-name">geral</span>
        <span class="channel-badge" id="channelBadge">0</span>
      </div>
    </div>

    <!-- Participantes na sidebar -->
    <div class="sidebar-section-label" style="margin-top:8px">
      PARTICIPANTES — <span id="userCount">0</span>
    </div>
    <div class="sidebar-participants" id="participantsList"></div>

    <!-- Spacer -->
    <div style="flex:1"></div>

    <!-- Barra de voz conectada -->
    <div class="voice-bar">
      <div class="voice-bar-status">
        <div class="voice-status-dot"></div>
        <div class="voice-status-text">
          <span class="voice-status-title">Voz conectada</span>
          <span class="voice-status-room" id="voiceStatusRoom">sala —</span>
        </div>
        <button class="voice-disconnect-btn" id="btnLeave" title="Sair da chamada">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M18.36 6.64a9 9 0 010 10.73" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14.12 9.88a4 4 0 010 4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Usuário logado -->
      <div class="user-row">
        <div class="user-avatar-wrap">
          <div class="user-avatar" id="myAvatarSidebar">?</div>
          <div class="user-status-dot online"></div>
        </div>
        <div class="user-info">
          <span class="user-name" id="myNameSidebar">—</span>
          <span class="user-tag">Em voz</span>
        </div>
        <div class="user-quick-btns">
          <button class="quick-btn" id="btnToggleMic" title="Microfone">
            <svg id="micIconSidebar" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M12 1a4 4 0 014 4v7a4 4 0 01-8 0V5a4 4 0 014-4z" stroke="currentColor" stroke-width="2"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="quick-btn" id="btnToggleCam" title="Câmera">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M23 7l-7 5 7 5V7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </aside>

  <!-- ════════════════════════════════════════════
       ÁREA PRINCIPAL
  ════════════════════════════════════════════ -->
  <main class="main">

    <!-- Header -->
    <header class="main-header">
      <div class="header-channel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="headerRoomName">geral</span>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="btnCopyLink" title="Copiar link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Área de chamada ── -->
    <div class="call-area" id="callArea">

      <!-- Modo tela compartilhada: grid lateral -->
      <div class="screen-tile hidden" id="screenTile">
        <video id="screenVideo" autoplay playsinline></video>
        <div class="tile-label" id="screenLabel">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          Tela de —
        </div>
      </div>

      <!-- Conteúdo centralizado da chamada -->
      <div class="call-content" id="callContent">

        <!-- Grade de cards de participantes -->
        <div class="participants-grid" id="videoGrid">

          <!-- Minha câmera -->
          <div class="participant-card" id="myVideoTile">
            <video id="myVideo" autoplay muted playsinline class="card-video"></video>
            <div class="card-overlay hidden" id="myNoCamOverlay">
              <div class="card-avatar" id="myCardAvatar">?</div>
              <div class="speaking-ring" id="myRing"></div>
            </div>
            <div class="card-footer">
              <span class="card-name" id="myVideoLabel">Você</span>
              <span class="card-muted hidden" id="myMutedIcon">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                  <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V5a3 3 0 00-5.94-.6" stroke="currentColor" stroke-width="2"/>
                  <path d="M17 16.95A7 7 0 015 12v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
            </div>
          </div>

        </div>

        <!-- Convite — separado, abaixo dos cards, nunca sobreposto -->
        <div class="invite-card" id="emptyState">
          <div class="invite-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="invite-text">
            <p class="invite-title">Sala pronta</p>
            <p class="invite-sub">Compartilhe o link com seus amigos</p>
          </div>
          <div class="invite-link-row">
            <input class="invite-link-input" type="text" id="shareLinkInput" readonly />
            <button class="invite-copy-btn" id="btnCopyLinkMain">Copiar</button>
          </div>
        </div>

      </div><!-- /call-content -->

    </div><!-- /call-area -->

    <!-- ── Barra de controles ── -->
    <div class="controls-bar">
      <div class="controls-center">

        <button class="ctrl-btn" id="ctrlMic" title="Microfone">
          <div class="ctrl-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 1a4 4 0 014 4v7a4 4 0 01-8 0V5a4 4 0 014-4z" stroke="currentColor" stroke-width="2"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="ctrl-label">Mic</span>
        </button>

        <button class="ctrl-btn" id="ctrlCam" title="Câmera">
          <div class="ctrl-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M23 7l-7 5 7 5V7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <span class="ctrl-label">Câmera</span>
        </button>

        <button class="ctrl-btn screen-btn" id="btnShareScreen" title="Compartilhar tela">
          <div class="ctrl-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 10l3-3 3 3M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="ctrl-label" id="shareScreenLabel">Tela</span>
        </button>

        <button class="ctrl-btn" id="ctrlSettings" title="Configurações">
          <div class="ctrl-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <span class="ctrl-label">Config</span>
        </button>

        <div class="ctrl-divider"></div>

        <button class="ctrl-btn leave-btn" id="ctrlLeave" title="Sair da chamada">
          <div class="ctrl-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M18.36 6.64a9 9 0 010 10.73M14.12 9.88a4 4 0 010 4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="ctrl-label">Sair</span>
        </button>

      </div>
    </div>

  </main>

</div><!-- /app -->

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/room.js"></script>
</body>
</html>
