<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TELAS — Sala</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="room-page">

  <!-- ══ LAYOUT DISCORD ════════════════════════════════════════════════════ -->
  <div class="dc-layout">

    <!-- ── Sidebar esquerda estilo Discord ─────────────────────────────── -->
    <aside class="dc-sidebar">

      <!-- Servidor (topo) -->
      <div class="dc-server-name" id="serverName">TELAS</div>

      <!-- Canal de voz -->
      <div class="dc-category">CANAIS DE VOZ</div>
      <div class="dc-channel active" id="channelName">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="channelLabel">geral</span>
      </div>

      <!-- Participantes no canal -->
      <div class="dc-voice-users" id="participantsList"></div>

      <!-- Barra de status de voz (fundo da sidebar) -->
      <div class="dc-voice-status">
        <div class="dc-voice-connected">
          <div class="dc-voice-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#57F287"/>
              <path d="M15.54 8.46a5 5 0 010 7.07" stroke="#57F287" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="dc-voice-info">
            <div class="dc-voice-label">Voz conectada</div>
            <div class="dc-voice-room">
              <span id="voiceRoomLabel">ATENDIMENTO 1</span>
              <span class="dc-voice-sep">/</span>
              <span id="voiceServerLabel">TELAS #</span><span id="voiceRoomId">—</span>
            </div>
          </div>
          <button class="dc-voice-disconnect" id="btnLeave" title="Desconectar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M18.36 6.64a9 9 0 010 10.73M14.54 9.46a4 4 0 010 5.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- Controles do usuário (rodapé estilo Discord) -->
        <div class="dc-user-controls">
          <div class="dc-user-info">
            <div class="dc-user-avatar" id="myAvatarSidebar">?</div>
            <div class="dc-user-text">
              <div class="dc-user-name" id="myNameSidebar">—</div>
              <div class="dc-user-status" id="myStatusLabel">
                <span class="dc-status-dot green"></span> Em voz
              </div>
            </div>
          </div>
          <div class="dc-user-btns">
            <button class="dc-ctrl" id="btnToggleMic" title="Microfone">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 1a4 4 0 014 4v7a4 4 0 01-8 0V5a4 4 0 014-4z" stroke="currentColor" stroke-width="2"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="dc-ctrl" id="btnToggleCam" title="Câmera">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M23 7l-7 5 7 5V7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <button class="dc-ctrl" title="Configurações">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ── Área principal ───────────────────────────────────────────────── -->
    <main class="dc-main">

      <!-- Header canal -->
      <header class="dc-main-header">
        <div class="dc-header-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="#8b949e" stroke-width="2" stroke-linejoin="round"/>
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="headerRoomName">geral</span>
        </div>
        <div class="dc-header-right">
          <!-- Botões estilo Discord toolbar -->
          <button class="dc-toolbar-btn" id="btnShareScreen" title="Compartilhar Tela">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 10l3-3 3 3M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="shareScreenLabel">Tela</span>
          </button>
          <button class="dc-toolbar-btn" id="btnToggleParticipants" title="Participantes">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="participantCount">0</span>
          </button>
          <button class="dc-toolbar-btn" id="btnToggleChat" title="Chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span class="chat-badge hidden" id="chatBadge">0</span>
          </button>
          <button class="dc-toolbar-btn" id="btnCopyLink" title="Copiar link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Grade de vídeos -->
      <div class="dc-video-grid" id="videoGrid">

        <!-- Tela compartilhada -->
        <div class="dc-video-tile screen-tile hidden" id="screenTile">
          <video id="screenVideo" autoplay playsinline></video>
          <div class="dc-tile-label" id="screenLabel">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Tela de —
          </div>
        </div>

        <!-- Minha câmera -->
        <div class="dc-video-tile" id="myVideoTile">
          <video id="myVideo" autoplay muted playsinline></video>
          <div class="dc-tile-label" id="myVideoLabel">Você</div>
          <div class="dc-tile-muted hidden" id="myMutedIcon">🔇</div>
        </div>
      </div>

      <!-- Estado vazio -->
      <div class="dc-empty-state" id="emptyState">
        <div class="dc-empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="#4f545c" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="#4f545c" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>Esperando participantes</h3>
        <p>Compartilhe o link para seus amigos entrarem</p>
        <div class="dc-share-box">
          <input type="text" id="shareLinkInput" readonly />
          <button class="dc-copy-btn" id="btnCopyLinkMain">Copiar</button>
        </div>
      </div>

    </main>

    <!-- ── Chat panel ────────────────────────────────────────────────────── -->
    <aside class="dc-chat-panel" id="chatPanel">
      <div class="dc-chat-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2"/>
        </svg>
        Chat
        <button class="dc-chat-close" id="btnCloseChat">✕</button>
      </div>
      <div class="dc-chat-messages" id="chatMessages">
        <div class="dc-chat-welcome">💬 Bem-vindo ao chat!</div>
      </div>
      <div class="dc-chat-input">
        <input type="text" id="chatInput" placeholder="Mensagem..." maxlength="500" autocomplete="off" />
        <button class="dc-send-btn" id="btnSendChat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </aside>

  </div><!-- /dc-layout -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
